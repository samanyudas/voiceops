services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: voiceops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local synthetic database password}
      POSTGRES_DB: voiceops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceops -d voiceops"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
