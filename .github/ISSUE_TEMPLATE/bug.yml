name: Bug report
description: Report observed behavior with reproduction evidence.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the runtime and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the exact steps and observed output. Remove private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification evidence
      description: State what ran and what remains unverified.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I removed credentials and private operational data.
          required: true
