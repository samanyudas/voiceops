name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag on main, such as v0.1.0
        required: true
        type: string
      publish_stable:
        description: Publish a stable release after explicit maintainer approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate the requested tag
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "origin/$DEFAULT_BRANCH"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Refusing to replace it.' >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run package:source
      - run: npm run check:package
      - name: Create the source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_STABLE" == true ]]; then
            gh release create "$TAG" artifacts/voiceops-source.tar.gz --verify-tag --generate-notes
          else
            gh release create "$TAG" artifacts/voiceops-source.tar.gz --verify-tag --generate-notes --draft
          fi
      - name: Post-run cleanup
        if: always()
        run: npm run clean
