name: Release-aware issue follow-up

on:
  pull_request_target:
    types: [opened, edited, reopened, closed]
  release:
    types: [published]
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read state without posting or changing issues
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-lifecycle
  cancel-in-progress: false

jobs:
  follow-up:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node tools/issue-lifecycle.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
